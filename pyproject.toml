[project]
name = "ha-transplant"
version = "0.1.0"
description = "Replace a device in Home Assistant without breaking anything."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "BLE"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "E501", "RUF001", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.transplant", "transplant_core"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["custom_components/transplant"]
